<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F1" />
  <meta name="description" content="NEW PAGE 新页 — 新一代知识内容消费与学习平台。每一次学习，都是打开人生的新一页。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FAF7F1'/%3E%3Cpath d='M6 8 L16 6 L26 8 L26 24 L16 26 L6 24 Z' fill='none' stroke='%23E8552B' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 6 L16 26' stroke='%23E8552B' stroke-width='1.8'/%3E%3C/svg%3E" />
  <title>NEW PAGE 新页</title>

  <!-- 字体预连接 + 加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- 主样式 -->
  <link rel="stylesheet" href="styles/main.css" />

  <!-- 防止主题闪烁（FART prevention）：在 CSS 解析后、主 JS 执行前就把 data 属性设好 -->
  <script>
  (function () {
    try {
      var LS_KEY = 'newpage:theme';
      var DEFAULT_PALETTE = 'amber';
      var DEFAULT_MODE = 'auto';
      var palette = DEFAULT_PALETTE;
      var mode = DEFAULT_MODE;
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        try {
          var saved = JSON.parse(raw);
          if (saved && typeof saved === 'object') {
            if (typeof saved.palette === 'string' && saved.palette.length) palette = saved.palette;
            if (typeof saved.mode    === 'string' && saved.mode.length)    mode    = saved.mode;
          }
        } catch (_) {}
      }
      var applied = (mode === 'dark') ? 'dark'
                  : (mode === 'light') ? 'light'
                  : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      var html = document.documentElement;
      html.setAttribute('data-palette', palette);
      html.setAttribute('data-theme',   applied);
      // 同步 theme-color 到浏览器顶栏
      var brandBg = applied === 'dark' ? '#16130F' : '#FAF7F1';
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', brandBg);
    } catch (_) {}
  })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 顶栏（Header 含导航 + 搜索 + 登录）由 Header 组件挂载 -->
    <header id="site-header" data-component="header"></header>

    <!-- 主视图容器：路由切换在此发生 -->
    <main id="view" class="view"></main>

    <!-- 页脚由 Footer 组件挂载 -->
    <footer id="site-footer" data-component="footer"></footer>

    <!-- 定制光标层（桌面端核心交互区） -->
    <div class="custom-cursor" data-component="cursor" aria-hidden="true"></div>

    <!-- Toast 浮层 -->
    <div class="toast-stack" data-component="toast-stack" aria-live="polite"></div>

    <!-- 页面转场 overlay -->
    <div class="page-transition-overlay" data-component="page-transition" aria-hidden="true"></div>
  </div>

  <!-- 主入口（ES Module） -->
  <script type="module" src="scripts/app/main.js"></script>
</body>
</html>
